server {
    listen 7000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the API Gateway container on port 7001
    location /api/ {
        # Using host.docker.internal to route safely to the gateway whether it's running via docker or host
        proxy_pass http://host.docker.internal:7001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
